openapi: 3.1.0
info:
  title: tacet Control Point & Remote Player API
  version: "1.0.0"
  description: >
    Headless multi-zone UPnP/DLNA control point, remote HTTP/SSE audio player
    endpoint protocol, and bit-perfect audio streaming server.
    All API errors return a structured ErrorEnvelope. Mutating requests from
    browsers require Content-Type: application/json and same-origin or
    explicitly allowed --cors-origin headers.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/openapi.yaml:
    get:
      summary: Download this OpenAPI 3.1 specification
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/info:
    get:
      summary: Server metadata and enabled capabilities
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
  /api/v1/settings:
    get:
      summary: Get global server settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      summary: Update global server settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                streamMode: { $ref: "#/components/schemas/StreamMode" }
                qobuzMaxQuality: { $ref: "#/components/schemas/QobuzQuality" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/events:
    get:
      summary: Server-Sent Events stream for multi-zone state updates
      description: >
        Emits named SSE events: snapshot, zone.playback, zone.volume, zone.queue,
        zone.error, zones.updated, settings.updated, qobuz.status, library.updated,
        and resync. Pass ?zone=<id> (repeatable) to filter zone events and zones.updated.
      parameters:
        - name: zone
          in: query
          description: Optional repeatable zoneId filter
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/zones:
    get:
      summary: List all discovered UPnP renderers and registered remote player zones
      responses:
        "200":
          description: Zone snapshots
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
  /api/v1/zones/discover:
    post:
      summary: Run SSDP discovery for UPnP MediaRenderers on the LAN
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                type: object
                required: [discovered, zones]
                properties:
                  discovered: { type: integer }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/connect:
    post:
      summary: Connect directly to a UPnP renderer description XML URL on the LAN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Connected zone snapshot and updated zone list
          content:
            application/json:
              schema:
                type: object
                required: [zone, zones]
                properties:
                  zone: { $ref: "#/components/schemas/ZoneSnapshot" }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}:
    get:
      summary: Get a single zone snapshot
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Remove an offline or stale UPnP renderer zone
      description: Removes a UPnP zone from memory. Remote player zones return 409 and must be unregistered via DELETE /api/v1/players/{zoneId}.
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Zone removed
          content:
            application/json:
              schema:
                type: object
                required: [removed, zoneId]
                properties:
                  removed: { type: boolean }
                  zoneId: { type: string }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue:
    put:
      summary: Replace zone queue from a source and start playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: "#/components/schemas/QueueSource" }
                startIndex: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Clear zone queue and stop playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items:
    post:
      summary: Append or Play-Next items in a zone queue
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: "#/components/schemas/QueueSource" }
                position: { type: string, enum: [end, next], default: end }
                autoplay: { type: boolean, default: true }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/jump:
    post:
      summary: Jump playback to a specific queue item by itemId
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items/{itemId}:
    delete:
      summary: Remove a queue item by itemId (returns 404 QUEUE_ITEM_NOT_FOUND if absent)
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items/{itemId}/move:
    post:
      summary: Reorder a queue item to a new 0-based index
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toIndex]
              properties:
                toIndex: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/play:
    post:
      summary: Start or resume playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/pause:
    post:
      summary: Pause playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/stop:
    post:
      summary: Stop playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/next:
    post:
      summary: Advance to next queued track
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/prev:
    post:
      summary: Restart current track (>5s) or jump to previous track
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/seek:
    post:
      summary: Seek to positionSec seconds
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec]
              properties:
                positionSec: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/volume:
    put:
      summary: Set zone volume (0–100)
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume]
              properties:
                volume: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/mute:
    put:
      summary: Set zone mute state
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/quality:
    put:
      summary: Set per-zone audio delivery quality (applies on next track)
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quality]
              properties:
                quality: { $ref: "#/components/schemas/AudioQuality" }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/shuffle:
    put:
      summary: Toggle shuffle for a zone queue
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/repeat:
    put:
      summary: Set repeat mode for a zone queue
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/RepeatMode" }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/status:
    get:
      summary: Unified library counts, missing counts, and per-provider sync status
      responses:
        "200":
          description: Library status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
  /api/v1/library/albums:
    get:
      summary: List, filter, or search unified library albums across local and remote sources
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [all, local, remote] }
        - name: provider
          in: query
          schema: { type: string }
        - name: artist
          in: query
          schema: { type: string }
        - name: genre
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [artist, title, year, added, plays] }
        - name: groupVersions
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated albums
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "304": { description: Not Modified }
  /api/v1/library/albums/{id}:
    get:
      summary: Fetch a library album with ordered tracks and alternate versions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Album with tracks and versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/albums/{id}/primary:
    post:
      summary: Pin an album as the Primary Version of its version group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/albums/{id}/version-group:
    delete:
      summary: Exclude an album from automatic/manual version grouping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/versions/group:
    post:
      summary: Manually group two or more albums as alternate versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [albumIds]
              properties:
                albumIds:
                  type: array
                  minItems: 2
                  items: { type: string }
      responses:
        "200":
          description: Created version group ID
          content:
            application/json:
              schema:
                type: object
                required: [versionGroupId]
                properties:
                  versionGroupId: { type: string }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/tracks:
    get:
      summary: List, filter, sort, or search unified library tracks
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [all, local, remote] }
        - name: provider
          in: query
          schema: { type: string }
        - name: artist
          in: query
          schema: { type: string }
        - name: albumId
          in: query
          schema: { type: string }
        - name: album
          in: query
          schema: { type: string }
        - name: genre
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [album, title, artist, year, added, plays, duration, quality] }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated tracks
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/v1/library/artists:
    get:
      summary: List unified album artists across local and remote sources
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [all, local, remote] }
        - name: provider
          in: query
          schema: { type: string }
        - name: genre
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated artists
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistSummary" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/v1/library/genres:
    get:
      summary: List distinct genres across the unified library
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [all, local, remote] }
        - name: provider
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Genres list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GenreSummary" }
  /api/v1/library/heavy-rotation:
    get:
      summary: Most-played library albums over the last N days (Rdio-style Heavy Rotation)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Heavy rotation albums
          content:
            application/json:
              schema:
                type: object
                required: [days, items]
                properties:
                  days: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HeavyRotationAlbum" }
  /api/v1/library/rescan:
    post:
      summary: Trigger incremental local NAS library rescan (async 202 by default, sync 200 with ?wait=true)
      parameters:
        - name: wait
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Completed rescan status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
        "202":
          description: Background rescan started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
  /api/v1/library/sync:
    post:
      summary: Trigger local scan and/or remote provider favorites sync
      parameters:
        - name: provider
          in: query
          schema: { type: string, default: all }
        - name: wait
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Completed sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
        "202":
          description: Background sync started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
  /api/v1/library/remote/albums:
    post:
      summary: Add a remote album to the unified library and mirror two-way to remote favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId]
              properties:
                provider: { type: string, default: qobuz }
                externalId: { type: string }
      responses:
        "200":
          description: Added library album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/remote/albums/{id}:
    delete:
      summary: Remove a remote album from the unified library and unfavorite two-way
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed confirmation
          content:
            application/json:
              schema:
                type: object
                required: [removed, id]
                properties:
                  removed: { type: boolean }
                  id: { type: string }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/remote/tracks:
    post:
      summary: Add a single remote track to the unified library and mirror two-way to remote favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId]
              properties:
                provider: { type: string, default: qobuz }
                externalId: { type: string }
      responses:
        "200":
          description: Added library track
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Track" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/remote/tracks/{id}:
    delete:
      summary: Remove a remote track from the unified library and unfavorite two-way
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed confirmation
          content:
            application/json:
              schema:
                type: object
                required: [removed, id]
                properties:
                  removed: { type: boolean }
                  id: { type: string }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/status:
    get:
      summary: Get Qobuz authentication and quality status
      responses:
        "200":
          description: Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
  /api/v1/qobuz/oauth/start:
    get:
      summary: Redirect to Qobuz OAuth sign-in
      responses:
        "302": { description: Redirect to Qobuz OAuth }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/oauth/callback:
    get:
      summary: Handle Qobuz OAuth callback
      responses:
        "302": { description: Redirect back to web client }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/login:
    post:
      summary: Authenticate Qobuz using an authToken or legacy email/password credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authToken: { type: string }
                email: { type: string }
                password: { type: string }
                appId: { type: string }
                appSecret: { type: string }
      responses:
        "200":
          description: Authenticated Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/session:
    delete:
      summary: Log out of Qobuz and clear in-memory session token
      responses:
        "200":
          description: Cleared Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
  /api/v1/library/search:
    get:
      summary: Unified FTS5 search across library artists, albums, and tracks with smart TopResult ranking
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        "200":
          description: Ranked library search matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibrarySearchResult" }
  /api/v1/qobuz/search:
    get:
      summary: Search Qobuz artists, albums, and tracks (local library matches are preferred when available)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Search matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzSearchResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/artist:
    get:
      summary: Fetch Qobuz artist profile and remote discography by ID or exact artist name
      parameters:
        - name: id
          in: query
          schema: { type: integer }
        - name: name
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Qobuz artist profile and albums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzArtistDetail" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/albums/{id}:
    get:
      summary: Fetch Qobuz album and ordered tracks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Album details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/discover:
    get:
      summary: Fetch unified discovery feed (genres and editorial album shelves)
      parameters:
        - name: genreIds
          in: query
          description: Comma-separated genre IDs (also accepts legacy genre_ids alias)
          schema: { type: string }
      responses:
        "200":
          description: Discovery feed (degrades to connected=false when no streaming provider is connected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverFeed" }
  /api/v1/discover/shelves/{slug}:
    get:
      summary: Fetch a paginated discovery shelf by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: genreIds
          in: query
          description: Comma-separated genre IDs (also accepts legacy genre_ids alias)
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated discovery shelf (degrades to empty items when disconnected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverShelfPage" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/albums/{id}/similar:
    get:
      summary: Fetch recommended similar albums for a local or streaming album ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Similar albums
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/artists/{id}/similar:
    get:
      summary: Fetch similar artists for a streaming provider artist ID (raw integer or qobuz:<id>)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Similar artists
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QobuzArtist" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players:
    post:
      summary: Register or reattach any HTTP/SSE audio player endpoint as a controllable zone
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPlayerRequest" }
      responses:
        "200":
          description: Player registration with zoneId, bearer token, and renderer info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRegistration" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}:
    patch:
      summary: Partially update metadata or capabilities of a registered player endpoint
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlayerRequest" }
      responses:
        "200":
          description: Updated renderer info
          content:
            application/json:
              schema:
                type: object
                required: [zoneId, renderer]
                properties:
                  zoneId: { type: string }
                  renderer: { $ref: "#/components/schemas/RendererInfo" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Explicitly unregister a registered player endpoint
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Player unregistered
          content:
            application/json:
              schema:
                type: object
                required: [unregistered, zoneId]
                properties:
                  unregistered: { type: boolean }
                  zoneId: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}/commands:
    get:
      summary: Server-Sent Events stream pushing transport and volume commands to a registered player endpoint
      description: >
        Emits connected (with current zone snapshot & serverTime), command (with
        SSE id matching command.id), and replaced events. On 404 after a server
        restart, clients should re-register via POST /api/v1/players.
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: text/event-stream of connected, command, and replaced events
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}/state:
    post:
      summary: Push player transport/volume state and command acknowledgements
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerStateReport" }
      responses:
        "204": { description: State accepted }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-player session token returned by POST /api/v1/players
    playerCookie:
      type: apiKey
      in: cookie
      name: tacet_player_session
      description: HttpOnly SameSite=Lax cookie scoped to /api/v1/players/{zoneId}
  parameters:
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
  responses:
    ErrorResponse:
      description: Structured JSON error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    StreamMode:
      type: string
      enum: [direct, relay]
    QobuzQuality:
      type: string
      enum: [mp3_320, flac_16_44, flac_24_96, flac_24_192]
    QobuzDelivery:
      type: string
      enum: [auto, force, direct]
    PlaybackState:
      type: string
      enum: [idle, playing, paused, buffering, stopped]
    AudioQuality:
      type: string
      enum: [opus_96, opus_128, opus_160, opus_256, original, wav]
    RepeatMode:
      type: string
      enum: [off, all, one]
    Settings:
      type: object
      required: [streamMode, qobuzMaxQuality, transcodeAvailable]
      properties:
        streamMode: { $ref: "#/components/schemas/StreamMode" }
        qobuzMaxQuality: { $ref: "#/components/schemas/QobuzQuality" }
        transcodeAvailable: { type: boolean }
    ServerInfo:
      type: object
      required: [name, version, apiVersion, capabilities]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        capabilities:
          type: object
          properties:
            localLibrary: { type: boolean }
            qobuz: { type: boolean }
            gena: { type: boolean }
    Track:
      type: object
      required: [id, source, title, artist, album, durationSec, mime, ext, available, inLibrary]
      properties:
        id: { type: string, description: "Opaque provider-prefixed ID (local:... or qobuz:...)" }
        source: { type: string }
        sourceType: { type: string, enum: [local, remote] }
        provider: { type: string }
        externalId: { type: string }
        title: { type: string }
        artist: { type: string }
        albumArtist: { type: string }
        album: { type: string }
        albumId: { type: string }
        genre: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        year: { type: integer }
        durationSec: { type: integer }
        mime: { type: string }
        ext: { type: string }
        size: { type: integer }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        channels: { type: integer }
        artworkUrl: { type: string }
        playCount: { type: integer }
        lastPlayedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        loved: { type: boolean }
        explicit: { type: boolean }
        available: { type: boolean }
        inLibrary: { type: boolean }
    AlbumVersion:
      type: object
      required: [id, source, sourceType, provider, title, trackCount, isPrimary, available]
      properties:
        id: { type: string }
        source: { type: string }
        sourceType: { type: string, enum: [local, remote] }
        provider: { type: string }
        title: { type: string }
        year: { type: integer }
        trackCount: { type: integer }
        primaryFormat: { type: string }
        maxBitDepth: { type: integer }
        maxSampleRate: { type: integer }
        isPrimary: { type: boolean }
        available: { type: boolean }
    AlbumCredit:
      type: object
      required: [name, roles]
      properties:
        name: { type: string }
        roles:
          type: array
          items: { type: string }
    Album:
      type: object
      required: [id, source, title, artist, trackCount, isPrimary, available, inLibrary]
      properties:
        id: { type: string }
        source: { type: string }
        sourceType: { type: string, enum: [local, remote] }
        provider: { type: string }
        externalId: { type: string }
        title: { type: string }
        artist: { type: string }
        genre: { type: string }
        label: { type: string }
        description: { type: string }
        copyright: { type: string }
        releaseDate: { type: string }
        awards:
          type: array
          items: { type: string }
        bookletUrl: { type: string }
        credits:
          type: array
          items: { $ref: "#/components/schemas/AlbumCredit" }
        year: { type: integer }
        artworkUrl: { type: string }
        trackCount: { type: integer }
        durationSec: { type: integer }
        primaryFormat: { type: string }
        maxBitDepth: { type: integer }
        maxSampleRate: { type: integer }
        versionGroupId: { type: string }
        versionCount: { type: integer }
        isPrimary: { type: boolean }
        isPartial: { type: boolean }
        playCount: { type: integer }
        addedAt: { type: string, format: date-time }
        available: { type: boolean }
        inLibrary: { type: boolean }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/AlbumVersion" }
    RendererInfo:
      type: object
      required: [id, name, location, host, hasVolume, supportsSetNext, supportsSeek, supportsEvents]
      properties:
        id: { type: string }
        kind: { type: string, enum: [upnp, player] }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        location: { type: string }
        host: { type: string }
        hasVolume: { type: boolean }
        supportsSetNext: { type: boolean }
        supportsSeek: { type: boolean }
        supportsEvents: { type: boolean }
        sinkProtocols:
          type: array
          items: { type: string }
    ArtistSummary:
      type: object
      required: [name, albumCount, trackCount, providers]
      properties:
        name: { type: string }
        albumCount: { type: integer }
        trackCount: { type: integer }
        artworkUrl: { type: string }
        providers:
          type: array
          items: { type: string }
    GenreSummary:
      type: object
      required: [name, albumCount, trackCount]
      properties:
        name: { type: string }
        albumCount: { type: integer }
        trackCount: { type: integer }
    HeavyRotationAlbum:
      allOf:
        - $ref: "#/components/schemas/Album"
        - type: object
          required: [recentPlays]
          properties:
            recentPlays: { type: integer }
            lastPlayed: { type: string, format: date-time }
    ProviderSyncStatus:
      type: object
      required: [provider, sourceType, connected, syncing, albums, tracks]
      properties:
        provider: { type: string }
        sourceType: { type: string, enum: [local, remote] }
        connected: { type: boolean }
        syncing: { type: boolean }
        albums: { type: integer }
        tracks: { type: integer }
        lastSyncAt: { type: string, format: date-time }
        lastError: { type: string }
    LibraryStatus:
      type: object
      required: [configured, scanning, tracks, albums, localTracks, localAlbums, remoteTracks, remoteAlbums, etag]
      properties:
        configured: { type: boolean }
        scanning: { type: boolean }
        tracks: { type: integer }
        albums: { type: integer }
        localTracks: { type: integer }
        localAlbums: { type: integer }
        remoteTracks: { type: integer }
        remoteAlbums: { type: integer }
        missingTracks: { type: integer }
        missingAlbums: { type: integer }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderSyncStatus" }
        etag: { type: string }
    QobuzStatus:
      type: object
      required: [configured, authenticated, maxFormatId, maxQuality]
      properties:
        configured: { type: boolean }
        authenticated: { type: boolean }
        userName: { type: string }
        subscription: { type: string }
        maxFormatId: { type: integer }
        maxQuality: { $ref: "#/components/schemas/QobuzQuality" }
    LibrarySearchResult:
      type: object
      required: [query, artists, albums, tracks]
      properties:
        query: { type: string }
        topResult:
          type: object
          properties:
            type: { type: string, enum: [artist, album, track] }
            score: { type: integer }
            artist: { $ref: "#/components/schemas/ArtistSummary" }
            album: { $ref: "#/components/schemas/Album" }
            track: { $ref: "#/components/schemas/Track" }
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistSummary" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
    QobuzArtist:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        artworkUrl: { type: string }
        albumsCount: { type: integer }
        biography: { type: string }
    QobuzArtistDetail:
      type: object
      required: [artist, albums]
      properties:
        artist: { $ref: "#/components/schemas/QobuzArtist" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        similarArtists:
          type: array
          items: { $ref: "#/components/schemas/QobuzArtist" }
    DiscoverGenre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    DiscoverShelf:
      type: object
      required: [slug, title, items]
      properties:
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Album" }
        hasMore: { type: boolean }
    DiscoverFeed:
      type: object
      required: [connected, genres, shelves]
      properties:
        connected: { type: boolean }
        genres:
          type: array
          items: { $ref: "#/components/schemas/DiscoverGenre" }
        shelves:
          type: array
          items: { $ref: "#/components/schemas/DiscoverShelf" }
    DiscoverShelfPage:
      type: object
      required: [slug, title, items, limit, offset, hasMore]
      properties:
        slug: { type: string }
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Album" }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
    QobuzSearchResult:
      type: object
      required: [artists, tracks, albums]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/QobuzArtist" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }
    QueueSource:
      oneOf:
        - type: object
          required: [type, albumId]
          properties:
            type: { const: album }
            albumId: { type: string }
        - type: object
          required: [type, trackIds]
          properties:
            type: { const: tracks }
            trackIds:
              type: array
              maxItems: 500
              items: { type: string }
    QueueItem:
      type: object
      required: [itemId, track]
      properties:
        itemId: { type: string }
        track: { $ref: "#/components/schemas/Track" }
    ZoneSnapshot:
      type: object
      required: [zoneId, renderer, revision, state, positionSec, positionUpdatedAt, durationSec, volume, muted, queue, currentIndex, gaplessArmed, eventsActive]
      properties:
        zoneId: { type: string }
        renderer: { $ref: "#/components/schemas/RendererInfo" }
        revision: { type: integer }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: integer }
        positionUpdatedAt: { type: string, format: date-time }
        durationSec: { type: integer }
        volume: { type: integer }
        muted: { type: boolean }
        queue:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        currentIndex: { type: integer }
        currentItemId: { type: string }
        currentTrack: { $ref: "#/components/schemas/Track" }
        gaplessArmed: { type: boolean }
        eventsActive: { type: boolean }
        audioQuality: { $ref: "#/components/schemas/AudioQuality" }
        activeQuality: { $ref: "#/components/schemas/AudioQuality" }
        shuffle: { type: boolean }
        repeat: { $ref: "#/components/schemas/RepeatMode" }
    RegisterPlayerRequest:
      type: object
      properties:
        playerId:
          type: string
          pattern: "^(player:)?[A-Za-z0-9_-]{1,64}$"
        name: { type: string, maxLength: 80, default: Remote Player }
        model: { type: string, maxLength: 80 }
        manufacturer: { type: string, maxLength: 80 }
        codecs:
          type: array
          items: { type: string }
        hasVolume: { type: boolean, default: true }
        supportsSetNext: { type: boolean, default: true }
        supportsSeek: { type: boolean, default: true }
        preferRelativeMedia: { type: boolean, default: true }
        qobuzDelivery: { $ref: "#/components/schemas/QobuzDelivery" }
        gracePeriodSec: { type: integer, minimum: 5, maximum: 3600, default: 20 }
    UpdatePlayerRequest:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 80 }
        manufacturer: { type: string, maxLength: 80 }
        codecs:
          type: array
          items: { type: string }
        hasVolume: { type: boolean }
        supportsSetNext: { type: boolean }
        supportsSeek: { type: boolean }
        preferRelativeMedia: { type: boolean }
        qobuzDelivery: { $ref: "#/components/schemas/QobuzDelivery" }
        gracePeriodSec: { type: integer, minimum: 5, maximum: 3600 }
    PlayerRegistration:
      type: object
      required: [zoneId, token, renderer]
      properties:
        zoneId: { type: string }
        token: { type: string }
        renderer: { $ref: "#/components/schemas/RendererInfo" }
    PlayerMediaPayload:
      type: object
      required: [id, url, title, artist, album, mime, durationSec]
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        artworkUrl: { type: string }
        mime: { type: string }
        durationSec: { type: integer }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        seekable: { type: boolean }
        transcoded: { type: boolean }
    PlayerCommand:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [set_uri, set_next_uri, play, pause, stop, seek, set_volume, set_mute]
        media: { $ref: "#/components/schemas/PlayerMediaPayload" }
        positionSec: { type: integer }
        volume: { type: integer }
        muted: { type: boolean }
    PlayerStateReport:
      type: object
      properties:
        cmdId: { type: string }
        ok: { type: boolean }
        errorCode: { type: string }
        errorMessage: { type: string }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: number, minimum: 0, maximum: 86400 }
        durationSec: { type: number, minimum: 0, maximum: 86400 }
        trackUri: { type: string }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
    SnapshotEvent:
      type: object
      required: [serverTime, zones, settings, qobuz, library]
      properties:
        serverTime: { type: string, format: date-time }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ZoneSnapshot" }
        settings: { $ref: "#/components/schemas/Settings" }
        qobuz: { $ref: "#/components/schemas/QobuzStatus" }
        library: { $ref: "#/components/schemas/LibraryStatus" }
    PlaybackEvent:
      type: object
      required: [zoneId, revision, state, positionSec, positionUpdatedAt, serverTime, durationSec, currentIndex, gaplessArmed, eventsActive]
      properties:
        zoneId: { type: string }
        revision: { type: integer }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: integer }
        positionUpdatedAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        durationSec: { type: integer }
        currentIndex: { type: integer }
        currentItemId: { type: string }
        currentTrack: { $ref: "#/components/schemas/Track" }
        gaplessArmed: { type: boolean }
        eventsActive: { type: boolean }
        audioQuality: { $ref: "#/components/schemas/AudioQuality" }
        activeQuality: { $ref: "#/components/schemas/AudioQuality" }
        shuffle: { type: boolean }
        repeat: { $ref: "#/components/schemas/RepeatMode" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            details: { type: object }
