openapi: 3.1.0
info:
  title: tacet Control Point & Remote Player API
  version: "1.0.0"
  description: >
    Headless multi-zone UPnP/DLNA control point, remote HTTP/SSE audio player
    endpoint protocol, and bit-perfect audio streaming server.
    All API errors return a structured ErrorEnvelope. Mutating requests from
    browsers require Content-Type: application/json and same-origin or
    explicitly allowed --cors-origin headers.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/openapi.yaml:
    get:
      summary: Download this OpenAPI 3.1 specification
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/info:
    get:
      summary: Server metadata and enabled capabilities
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
  /api/v1/settings:
    get:
      summary: Get global server settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      summary: Update global server settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                streamMode: { $ref: "#/components/schemas/StreamMode" }
                qobuzMaxQuality: { $ref: "#/components/schemas/QobuzQuality" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/events:
    get:
      summary: Server-Sent Events stream for multi-zone state updates
      description: >
        Emits named SSE events: snapshot, zone.playback, zone.volume, zone.queue,
        zone.error, zones.updated, settings.updated, qobuz.status, library.updated,
        and resync. Pass ?zone=<id> (repeatable) to filter zone events and zones.updated.
      parameters:
        - name: zone
          in: query
          description: Optional repeatable zoneId filter
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/zones:
    get:
      summary: List all discovered UPnP renderers and registered remote player zones
      responses:
        "200":
          description: Zone snapshots
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
  /api/v1/zones/discover:
    post:
      summary: Run SSDP discovery for UPnP MediaRenderers on the LAN
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                type: object
                required: [discovered, zones]
                properties:
                  discovered: { type: integer }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/connect:
    post:
      summary: Connect directly to a UPnP renderer description XML URL on the LAN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Connected zone snapshot and updated zone list
          content:
            application/json:
              schema:
                type: object
                required: [zone, zones]
                properties:
                  zone: { $ref: "#/components/schemas/ZoneSnapshot" }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}:
    get:
      summary: Get a single zone snapshot
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Remove an offline or stale UPnP renderer zone
      description: Removes a UPnP zone from memory. Remote player zones return 409 and must be unregistered via DELETE /api/v1/players/{zoneId}.
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Zone removed
          content:
            application/json:
              schema:
                type: object
                required: [removed, zoneId]
                properties:
                  removed: { type: boolean }
                  zoneId: { type: string }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue:
    put:
      summary: Replace zone queue from a source and start playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: "#/components/schemas/QueueSource" }
                startIndex: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Clear zone queue and stop playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items:
    post:
      summary: Append or Play-Next items in a zone queue
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: "#/components/schemas/QueueSource" }
                position: { type: string, enum: [end, next], default: end }
                autoplay: { type: boolean, default: true }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/jump:
    post:
      summary: Jump playback to a specific queue item by itemId
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items/{itemId}:
    delete:
      summary: Remove a queue item by itemId (returns 404 QUEUE_ITEM_NOT_FOUND if absent)
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/queue/items/{itemId}/move:
    post:
      summary: Reorder a queue item to a new 0-based index
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toIndex]
              properties:
                toIndex: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/play:
    post:
      summary: Start or resume playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/pause:
    post:
      summary: Pause playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/stop:
    post:
      summary: Stop playback
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/next:
    post:
      summary: Advance to next queued track
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/prev:
    post:
      summary: Restart current track (>5s) or jump to previous track
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/transport/seek:
    post:
      summary: Seek to positionSec seconds
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec]
              properties:
                positionSec: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/volume:
    put:
      summary: Set zone volume (0–100)
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume]
              properties:
                volume: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/zones/{zoneId}/mute:
    put:
      summary: Set zone mute state
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        "200":
          description: Updated zone snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSnapshot" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/status:
    get:
      summary: Local NAS library scan status and counts
      responses:
        "200":
          description: Library status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
  /api/v1/library/albums:
    get:
      summary: List or search local albums (paginated, supports ETag / If-None-Match)
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [artist, title, year] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated albums
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "304": { description: Not Modified }
  /api/v1/library/albums/{id}:
    get:
      summary: Fetch a single local album with ordered tracks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Album with tracks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/library/tracks:
    get:
      summary: List or search local tracks (paginated)
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated tracks
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/v1/library/rescan:
    post:
      summary: Trigger local library rescan (async 202 by default, sync 200 with ?wait=true)
      parameters:
        - name: wait
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Completed rescan status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
        "202":
          description: Background rescan started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
  /api/v1/qobuz/status:
    get:
      summary: Get Qobuz authentication and quality status
      responses:
        "200":
          description: Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
  /api/v1/qobuz/oauth/start:
    get:
      summary: Redirect to Qobuz OAuth sign-in
      responses:
        "302": { description: Redirect to Qobuz OAuth }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/oauth/callback:
    get:
      summary: Handle Qobuz OAuth callback
      responses:
        "302": { description: Redirect back to web client }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/login:
    post:
      summary: Authenticate Qobuz using an authToken or legacy email/password credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authToken: { type: string }
                email: { type: string }
                password: { type: string }
                appId: { type: string }
                appSecret: { type: string }
      responses:
        "200":
          description: Authenticated Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/session:
    delete:
      summary: Log out of Qobuz and clear in-memory session token
      responses:
        "200":
          description: Cleared Qobuz status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzStatus" }
  /api/v1/qobuz/search:
    get:
      summary: Search Qobuz tracks and albums
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Search matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QobuzSearchResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/qobuz/albums/{id}:
    get:
      summary: Fetch Qobuz album and ordered tracks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Album details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players:
    post:
      summary: Register or reattach any HTTP/SSE audio player endpoint as a controllable zone
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPlayerRequest" }
      responses:
        "200":
          description: Player registration with zoneId, bearer token, and renderer info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRegistration" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}:
    patch:
      summary: Partially update metadata or capabilities of a registered player endpoint
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlayerRequest" }
      responses:
        "200":
          description: Updated renderer info
          content:
            application/json:
              schema:
                type: object
                required: [zoneId, renderer]
                properties:
                  zoneId: { type: string }
                  renderer: { $ref: "#/components/schemas/RendererInfo" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Explicitly unregister a registered player endpoint
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: Player unregistered
          content:
            application/json:
              schema:
                type: object
                required: [unregistered, zoneId]
                properties:
                  unregistered: { type: boolean }
                  zoneId: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}/commands:
    get:
      summary: Server-Sent Events stream pushing transport and volume commands to a registered player endpoint
      description: >
        Emits connected (with current zone snapshot & serverTime), command (with
        SSE id matching command.id), and replaced events. On 404 after a server
        restart, clients should re-register via POST /api/v1/players.
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      responses:
        "200":
          description: text/event-stream of connected, command, and replaced events
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/players/{zoneId}/state:
    post:
      summary: Push player transport/volume state and command acknowledgements
      security:
        - bearerAuth: []
        - playerCookie: []
      parameters: [$ref: "#/components/parameters/ZoneId"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerStateReport" }
      responses:
        "204": { description: State accepted }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-player session token returned by POST /api/v1/players
    playerCookie:
      type: apiKey
      in: cookie
      name: tacet_player_session
      description: HttpOnly SameSite=Lax cookie scoped to /api/v1/players/{zoneId}
  parameters:
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
  responses:
    ErrorResponse:
      description: Structured JSON error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    StreamMode:
      type: string
      enum: [direct, relay]
    QobuzQuality:
      type: string
      enum: [mp3_320, flac_16_44, flac_24_96, flac_24_192]
    QobuzDelivery:
      type: string
      enum: [auto, force, direct]
    PlaybackState:
      type: string
      enum: [idle, playing, paused, buffering, stopped]
    Settings:
      type: object
      required: [streamMode, qobuzMaxQuality]
      properties:
        streamMode: { $ref: "#/components/schemas/StreamMode" }
        qobuzMaxQuality: { $ref: "#/components/schemas/QobuzQuality" }
    ServerInfo:
      type: object
      required: [name, version, apiVersion, capabilities]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        capabilities:
          type: object
          properties:
            localLibrary: { type: boolean }
            qobuz: { type: boolean }
            gena: { type: boolean }
    Track:
      type: object
      required: [id, source, title, artist, album, trackNumber, discNumber, durationSec, mime, ext]
      properties:
        id: { type: string, description: "Opaque source-prefixed ID (local:... or qobuz:...)" }
        source: { type: string, enum: [local, qobuz] }
        title: { type: string }
        artist: { type: string }
        albumArtist: { type: string }
        album: { type: string }
        albumId: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        year: { type: integer }
        durationSec: { type: integer }
        mime: { type: string }
        ext: { type: string }
        size: { type: integer }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        channels: { type: integer }
        artworkUrl: { type: string }
        qobuzTrackId: { type: integer }
    Album:
      type: object
      required: [id, source, title, artist, trackCount]
      properties:
        id: { type: string }
        source: { type: string, enum: [local, qobuz] }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        artworkUrl: { type: string }
        trackCount: { type: integer }
        maxBitDepth: { type: integer }
        maxSampleRate: { type: integer }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
    RendererInfo:
      type: object
      required: [id, name, location, host, hasVolume, supportsSetNext, supportsSeek, supportsEvents]
      properties:
        id: { type: string }
        kind: { type: string, enum: [upnp, player] }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        location: { type: string }
        host: { type: string }
        hasVolume: { type: boolean }
        supportsSetNext: { type: boolean }
        supportsSeek: { type: boolean }
        supportsEvents: { type: boolean }
        sinkProtocols:
          type: array
          items: { type: string }
    LibraryStatus:
      type: object
      required: [scanning, trackCount, albumCount]
      properties:
        scanning: { type: boolean }
        trackCount: { type: integer }
        albumCount: { type: integer }
        lastScan: { type: string, format: date-time }
    QobuzStatus:
      type: object
      required: [configured, authenticated, maxFormatId, maxQuality]
      properties:
        configured: { type: boolean }
        authenticated: { type: boolean }
        user: { type: string }
        subscription: { type: string }
        maxFormatId: { type: integer }
        maxQuality: { $ref: "#/components/schemas/QobuzQuality" }
    QobuzSearchResult:
      type: object
      required: [tracks, albums]
      properties:
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }
    QueueSource:
      oneOf:
        - type: object
          required: [type, albumId]
          properties:
            type: { const: album }
            albumId: { type: string }
        - type: object
          required: [type, trackIds]
          properties:
            type: { const: tracks }
            trackIds:
              type: array
              maxItems: 500
              items: { type: string }
    QueueItem:
      type: object
      required: [itemId, track]
      properties:
        itemId: { type: string }
        track: { $ref: "#/components/schemas/Track" }
    ZoneSnapshot:
      type: object
      required: [zoneId, renderer, revision, state, positionSec, positionUpdatedAt, durationSec, volume, muted, queue, currentIndex, gaplessArmed, eventsActive]
      properties:
        zoneId: { type: string }
        renderer: { $ref: "#/components/schemas/RendererInfo" }
        revision: { type: integer }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: integer }
        positionUpdatedAt: { type: string, format: date-time }
        durationSec: { type: integer }
        volume: { type: integer }
        muted: { type: boolean }
        queue:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        currentIndex: { type: integer }
        currentItemId: { type: string }
        currentTrack: { $ref: "#/components/schemas/Track" }
        gaplessArmed: { type: boolean }
        eventsActive: { type: boolean }
    RegisterPlayerRequest:
      type: object
      properties:
        playerId:
          type: string
          pattern: "^(player:)?[A-Za-z0-9_-]{1,64}$"
        name: { type: string, maxLength: 80, default: Remote Player }
        model: { type: string, maxLength: 80 }
        manufacturer: { type: string, maxLength: 80 }
        codecs:
          type: array
          items: { type: string }
        hasVolume: { type: boolean, default: true }
        supportsSetNext: { type: boolean, default: true }
        supportsSeek: { type: boolean, default: true }
        preferRelativeMedia: { type: boolean, default: true }
        qobuzDelivery: { $ref: "#/components/schemas/QobuzDelivery" }
        gracePeriodSec: { type: integer, minimum: 5, maximum: 3600, default: 20 }
    UpdatePlayerRequest:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 80 }
        manufacturer: { type: string, maxLength: 80 }
        codecs:
          type: array
          items: { type: string }
        hasVolume: { type: boolean }
        supportsSetNext: { type: boolean }
        supportsSeek: { type: boolean }
        preferRelativeMedia: { type: boolean }
        qobuzDelivery: { $ref: "#/components/schemas/QobuzDelivery" }
        gracePeriodSec: { type: integer, minimum: 5, maximum: 3600 }
    PlayerRegistration:
      type: object
      required: [zoneId, token, renderer]
      properties:
        zoneId: { type: string }
        token: { type: string }
        renderer: { $ref: "#/components/schemas/RendererInfo" }
    PlayerMediaPayload:
      type: object
      required: [id, url, title, artist, album, mime, durationSec]
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        artworkUrl: { type: string }
        mime: { type: string }
        durationSec: { type: integer }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
    PlayerCommand:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [set_uri, set_next_uri, play, pause, stop, seek, set_volume, set_mute]
        media: { $ref: "#/components/schemas/PlayerMediaPayload" }
        positionSec: { type: integer }
        volume: { type: integer }
        muted: { type: boolean }
    PlayerStateReport:
      type: object
      properties:
        cmdId: { type: string }
        ok: { type: boolean }
        errorCode: { type: string }
        errorMessage: { type: string }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: number, minimum: 0, maximum: 86400 }
        durationSec: { type: number, minimum: 0, maximum: 86400 }
        trackUri: { type: string }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
    SnapshotEvent:
      type: object
      required: [serverTime, zones, settings, qobuz, library]
      properties:
        serverTime: { type: string, format: date-time }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ZoneSnapshot" }
        settings: { $ref: "#/components/schemas/Settings" }
        qobuz: { $ref: "#/components/schemas/QobuzStatus" }
        library: { $ref: "#/components/schemas/LibraryStatus" }
    PlaybackEvent:
      type: object
      required: [zoneId, revision, state, positionSec, positionUpdatedAt, serverTime, durationSec, currentIndex, gaplessArmed, eventsActive]
      properties:
        zoneId: { type: string }
        revision: { type: integer }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSec: { type: integer }
        positionUpdatedAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        durationSec: { type: integer }
        currentIndex: { type: integer }
        currentItemId: { type: string }
        currentTrack: { $ref: "#/components/schemas/Track" }
        gaplessArmed: { type: boolean }
        eventsActive: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            details: { type: object }
