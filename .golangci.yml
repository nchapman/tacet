version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G401 # MD5 is mandated by the Qobuz v0.2 signing protocol
        - G501 # crypto/md5 import is mandated by the Qobuz v0.2 signing protocol
        - G704 # Private-LAN renderer and Qobuz CDN URLs are explicitly validated
        - G706 # Standard server stderr logging of CLI flags and UPnP device names
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: error-strings
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: unused-parameter
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - unparam
          - bodyclose
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - tacet
